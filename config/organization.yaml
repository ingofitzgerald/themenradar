# Organisationsprofil WWF Deutschland
# Wird für die Bewertung von Anschlussfähigkeit und Pressechancen genutzt.

name: "WWF Deutschland"

mission: >
  WWF Deutschland ist Teil des internationalen WWF-Netzwerks und setzt sich
  für den Schutz der biologischen Vielfalt, den Erhalt natürlicher Lebensräume,
  den Klimaschutz sowie die nachhaltige Nutzung natürlicher Ressourcen ein.
  Der WWF arbeitet weltweit in Naturschutzprojekten und engagiert sich
  gleichzeitig in Deutschland und Europa für wirksame Umwelt- und Klimapolitik.

