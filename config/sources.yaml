      - conservation
    feed_url: https://www.nabu.de/rssfeed.php

  - name: BUND
    type: ngo
    source_role: stakeholder
    priority: 7
    focus:
      - climate
      - biodiversity
      - policy
    feed_url: https://www.bund.net/themen/aktuelles/rss.xml

  - name: Greenpeace Deutschland
    type: ngo
    source_role: stakeholder
    priority: 7
    focus:
      - climate
      - oceans
      - energy
    feed_url: https://presseportal.greenpeace.de/press_releases.atom
